name: InfoGraphic CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: build-node26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: npm install -g pnpm@$(node -p 'require("./package.json").packageManager.replace(/^pnpm@/, "")')

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm run validate

      - name: Build project
        run: pnpm run build

  release:
    runs-on: build-node26
    timeout-minutes: 10
    needs: [validate]

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: '1'
        run: node release.mjs

  discord-status:
    runs-on: build-node26
    timeout-minutes: 10
    needs: [validate, release]
    if: ${{ always() && github.ref == 'refs/heads/main' }}

    steps:
      - name: Send Discord status
        uses: iShark5060/actions-discord-status@66f6681ff19536b7787feecc4fdc20c506de365b # v1.2.1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job_results: ${{ join(needs.*.result, ',') }}
          mention_on: failure
          content: '<@${{ secrets.DISCORD_USERID }}>'
          title: ${{ github.workflow }}
          description: ${{ contains(needs.*.result, 'failure') && 'CI failed. Please review logs.' || contains(needs.*.result, 'cancelled') && 'CI was cancelled.' || contains(needs.*.result, 'skipped') && 'CI was skipped.' || 'CI succeeded.' }}
