name: InfoGraphic CI

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 26

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'build(release)') }}

    permissions:
      contents: write
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout full history
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_PAT }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Bump version
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.CI_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Resolve target SHA
        id: target
        shell: bash
        run: |
          git fetch origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [version]

    steps:
      - name: Checkout release target
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ needs.version.outputs.target_sha }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Run quality checks
        run: pnpm run validate

      - name: Build project
        run: pnpm run build

  discord-status:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [version, validate]
    if: ${{ always() && github.ref == 'refs/heads/main' }}

    steps:
      - name: Send Discord status
        uses: iShark5060/actions-discord-status@66f6681ff19536b7787feecc4fdc20c506de365b # v1.2.1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job_results: ${{ join(needs.*.result, ',') }}
          mention_on: failure
          content: '<@${{ secrets.DISCORD_USERID }}>'
          title: ${{ github.workflow }}
          description: ${{ contains(needs.*.result, 'failure') && 'CI failed. Please review logs.' || contains(needs.*.result, 'cancelled') && 'CI was cancelled.' || contains(needs.*.result, 'skipped') && 'CI was skipped.' || 'CI succeeded.' }}
